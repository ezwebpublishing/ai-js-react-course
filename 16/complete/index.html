<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>왜 React가 필요할까?</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <main class="app">
    <section class="hero">
      <h1>왜 React가 필요할까?</h1>
      <p>찜하기 상태를 직접 관리하며 바닐라 JavaScript의 한계를 체감합니다.</p>
    </section>

    <section class="summary-panel">
      <p>
        찜한 상품:
        <strong id="favoriteCount">0</strong>개 /
        전체 상품:
        <strong id="totalCount">0</strong>개
      </p>
    </section>

    <section class="filter-panel">
      <label class="field">
        <span>검색어 입력</span>
        <input id="keywordInput" type="text" placeholder="상품명 또는 설명 검색">
      </label>

      <div id="categoryFilter" class="category-filter">
        <button class="category-button active" type="button" data-category="전체">전체</button>
        <button class="category-button" type="button" data-category="전자제품">전자제품</button>
        <button class="category-button" type="button" data-category="음향기기">음향기기</button>
        <button class="category-button" type="button" data-category="컴퓨터 주변기기">컴퓨터 주변기기</button>
        <button class="category-button" type="button" data-category="생활가전">생활가전</button>
      </div>

      <p id="statusMessage" class="status-message">
        검색어, 카테고리, 찜하기 상태가 모두 화면에 영향을 줍니다.
      </p>
    </section>

    <section class="product-section">
      <div class="section-title">
        <h2>상품 목록</h2>
        <span>총 <strong id="productCount" class="count">0</strong>개</span>
      </div>

      <p id="emptyMessage" class="empty-message"></p>
      <div id="productList" class="product-list"></div>
    </section>

    <section class="control-panel">
      <button id="addProductBtn" class="primary" type="button">상품 추가</button>
      <button id="removeProductBtn" class="secondary" type="button">마지막 상품 삭제</button>
      <button id="clearSelectionBtn" class="warning" type="button">선택 해제</button>
      <button id="resetFilterBtn" class="success" type="button">필터 초기화</button>
    </section>
  </main>

  <script type="module" src="./js/script.js"></script>
</body>
</html>
