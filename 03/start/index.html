<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript 시작하기</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <main class="product">
    <span id="badge" class="badge">BEST</span>

    <div class="image-box">
      <span>PRODUCT</span>
    </div>

    <h1 id="productName">상품명</h1>
    <p id="productDescription" class="description">상품 설명</p>
    <p id="price" class="price">0원</p>

    <p id="message">
      상품 정보가 준비되었습니다.
    </p>

    <button id="likeBtn" type="button">
      ♡ 찜하기 <span id="likeCount">0</span>
    </button>

    <button id="resetBtn" class="reset-button" type="button">
      초기화
    </button>
  </main>

  <script src="./js/script.js"></script>
</body>
</html>
