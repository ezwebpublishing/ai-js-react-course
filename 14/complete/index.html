<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 검색 기능 만들기 - 구조 분리</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <main class="app">
    <section class="hero">
      <h1>상품 탐색</h1>
      <p>검색어를 기준으로 상품 데이터를 필터링하고 결과를 다시 렌더링합니다.</p>
    </section>

    <section class="search-panel">
      <div class="search-grid">
        <label class="field">
          <span>검색어 입력</span>
          <input id="keywordInput" type="text" placeholder="상품명 또는 설명 검색">
        </label>

        <label class="field">
          <span>카테고리 선택</span>
          <select id="categorySelect">
            <option value="전체">전체</option>
            <option value="전자제품">전자제품</option>
            <option value="음향기기">음향기기</option>
            <option value="컴퓨터 주변기기">컴퓨터 주변기기</option>
            <option value="생활가전">생활가전</option>
          </select>
        </label>
      </div>

      <p id="statusMessage" class="status-message">
        검색어를 입력하면 상품 목록이 변경됩니다.
      </p>
    </section>

    <section class="product-section">
      <div class="section-title">
        <h2>검색 결과</h2>
        <span>총 <strong id="productCount" class="count">0</strong>개</span>
      </div>

      <p id="emptyMessage" class="empty-message"></p>
      <div id="productList" class="product-list"></div>
    </section>

    <section class="control-panel">
      <button id="addProductBtn" class="primary" type="button">상품 추가</button>
      <button id="removeProductBtn" class="secondary" type="button">마지막 상품 삭제</button>
      <button id="clearSelectionBtn" class="warning" type="button">선택 해제</button>
      <button id="resetSearchBtn" class="success" type="button">검색 초기화</button>
    </section>
  </main>

  <script type="module" src="./js/script.js"></script>
</body>
</html>
