<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>객체 이해하기</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <main class="product">
    <span id="badge" class="badge">BEST</span>
    <span id="discountBadge" class="discount-badge">SALE</span>

    <div class="image-box">
      <span>PRODUCT</span>
    </div>

    <h1 id="productName">상품명</h1>
    <p id="productDescription" class="description">상품 설명</p>

    <p class="price-wrap">
      <span id="price" class="price">0원</span>
      <span id="finalPrice" class="final-price">0원</span>
    </p>

    <p id="categoryMessage" class="info">카테고리</p>
    <p id="deliveryMessage" class="info">배송 정보</p>
    <p id="stockMessage" class="info">구매 가능 여부</p>

    <section class="recommend">
      <h2>추천 상품 <span id="productCount">0</span>개</h2>
      <ul id="recommendList"></ul>

      <div class="array-buttons">
        <button id="addProductBtn" class="sub-button" type="button">
          추천 상품 추가
        </button>
        <button id="removeProductBtn" class="sub-button" type="button">
          마지막 상품 삭제
        </button>
      </div>
    </section>

    <p id="message">
      상품 정보가 준비되었습니다.
    </p>

    <button id="likeBtn" type="button">
      ♡ 찜하기 <span id="likeCount">0</span>
    </button>

    <button id="resetBtn" class="reset-button" type="button">
      초기화
    </button>
  </main>

  <script src="./js/script.js"></script>
</body>
</html>
